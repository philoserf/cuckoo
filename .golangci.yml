# golangci-lint v2 configuration: every linter on, then disable only what
# fights this repository's design.
version: "2"

linters:
  default: all
  disable:
    # Deprecated and superseded by linters that are on.
    - exhaustruct # replaced by exhaustruct_v5
    - wsl # replaced by wsl_v5
    - gomodguard # replaced by gomodguard_v2

    # Everything below was measured rather than assumed, and the count is
    # part of the reason.

    # 24 findings. The sounds are transcribed from the browser clock: 2140 Hz
    # for the tic, a 3.5 ms decay, a partial at 2.76 times the fundamental.
    # Naming each one would rename the recipe; the number is the sound.
    - mnd

    # 15 findings, and the linter takes no settings. Every one is a zero-value
    # struct the code relies on (a fresh mixer or striker), oto's options
    # left at their defaults, or a test table naming only the fields its case
    # exercises.
    - exhaustruct_v5

  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/ebitengine/oto/v3
            - github.com/hajimehoshi/go-mp3
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
    varnamelen:
      # 15 findings at the defaults. Configured rather than disabled: the
      # linter still catches an anonymous name used far from where it was
      # declared.
      ignore-names:
        # Note names: the rods' pitches.
        [b, b3, e, e4, fs, gs,
         # Ordinary Go and signal notation: index, sample, time, voice,
         # buffer or partial, note, test case, the ramp's endpoints and instant.
         at, i, n, p, s, t, tc, to, v]
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # G602 reads equal's index into want as out of range; the length check
      # above it rules that out. (1 finding.)
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports

  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
