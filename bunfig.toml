[fmt]
# Leave code in Markdown fences alone: a fenced snippet is quoted, and
# formatting it would change what it quotes.
embeddedLanguageFormatting = "off"
ignorePatterns = [
  # The varnamelen ignore list is a commented YAML flow sequence; bun fmt would
  # explode it to one entry per line and lose the grouping.
  ".golangci.yml",
]
